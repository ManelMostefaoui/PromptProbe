<!DOCTYPE html>
<html>
<head>
  <title>TechBot Support</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    #log { border: 1px solid #0f0; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    input { width: 80%; padding: 8px; background: #000; color: #0f0; border: 1px solid #0f0; }
    button { padding: 8px; }
  </style>
</head>
<body>
  <h2>TechBot Support Chat</h2>
  <div id="log"></div>
  <input id="msg" placeholder="Type a message..." />
  <button onclick="send()">Send</button>

  <script>
    async function send() {
      const input = document.getElementById("msg");
      const log = document.getElementById("log");
      const text = input.value;
      if (!text) return;

      log.innerHTML += `<div><b>You:</b> ${text}</div>`;
      input.value = "";

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      log.innerHTML += `<div><b>TechBot:</b> ${data.reply}</div>`;
      log.scrollTop = log.scrollHeight;
    }
  </script>
</body>
</html>
